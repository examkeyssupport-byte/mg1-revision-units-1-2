<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision Units 1-2 - Mohammed and Hatem</title>
<style>
:root{--pink:#c0168a;--pink2:#fbe3f3;--ink:#1c1c28;--ok:#1b7a3d;--okbg:#e4f6e9;--no:#b3261e;--nobg:#fde8e6;--line:#d9c7d3;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f6eef3;color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:18px;line-height:1.6}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--pink);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.who,.tab{font:inherit;font-weight:700;border:2px solid var(--pink);background:#fff;color:var(--pink);border-radius:999px;padding:6px 16px;cursor:pointer}
.who{font-size:19px}
.who.on,.tab.on{background:var(--pink);color:#fff}
.who small{font-weight:600;margin-inline-start:6px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.bar{flex-basis:100%;height:10px;background:var(--pink2);border-radius:6px;overflow:hidden;max-width:900px}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.paper{max-width:900px;margin:16px auto 60px;background:#fff;border:3px solid var(--pink);padding:18px 22px 28px}
.ph{text-align:center;border-bottom:2px dashed var(--pink);padding-bottom:8px;margin-bottom:6px}
.ph .rt{font-size:30px;font-weight:800;color:var(--pink);letter-spacing:1px}
.ph .ut{font-size:22px;font-style:italic;color:var(--pink)}
.ph .turn{direction:rtl;font-size:17px;color:#555}
.part{text-align:center;font-family:Georgia,serif;font-size:24px;color:var(--pink);text-decoration:underline;margin:22px 0 4px}
h3{color:var(--pink);font-size:20px;margin:20px 0 2px;border-bottom:1.5px solid var(--pink);display:inline-block}
h3:before{content:"\270F\FE0F ";}
.hint-ar{direction:rtl;text-align:right;color:#555;font-size:16px;margin:2px 0 6px}
details.rule{direction:rtl;text-align:right;background:#fff8e6;border:1.5px solid #e6c56a;border-radius:10px;padding:6px 12px;margin:6px 0 10px;font-size:17px}
details.rule summary{cursor:pointer;font-weight:700;color:#7a5600}
details.rule ul{margin:6px 0;padding-inline-start:22px}
details.rule b,.fb b,.gl b{direction:ltr;unicode-bidi:isolate;color:#0b4a8f}
.pre{margin:6px 0 8px;font-weight:700}
.pre table{border-collapse:collapse}
.pre td{border:1px solid #333;padding:2px 12px}
.q{display:flex;gap:8px;padding:8px 6px;border-bottom:1px dotted var(--line)}
.q.done{background:#fbfffb}
.q .n{font-weight:800;min-width:30px}
.q .b{flex:1;min-width:0}
.q img{display:block;height:110px;max-width:100%;margin-bottom:4px}
.line{font-size:19px}
.line u{font-weight:700;text-decoration-thickness:2px}
.arrow{color:var(--pink);font-weight:800;margin:0 6px}
.opts{display:inline-flex;flex-wrap:wrap;gap:6px;margin:2px 4px;vertical-align:middle}
.chip{font:inherit;font-weight:700;border:2px solid #555;background:#fff;color:var(--ink);border-radius:10px;padding:3px 12px;cursor:pointer;min-height:38px}
.chip:hover:not(:disabled){background:var(--pink2);border-color:var(--pink)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--nobg);border-color:var(--no);color:var(--no);text-decoration:line-through;animation:shake .3s}
.chip.dim{opacity:.35}
.chip:disabled{cursor:default}
input.gap{font:inherit;font-weight:700;border:0;border-bottom:2.5px solid #333;background:#f7f7fb;padding:2px 8px;margin:2px 4px;color:#0b4a8f;max-width:100%}
input.gap:focus{outline:2px solid var(--pink);background:#fff}
input.gap.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
input.gap.bad{background:var(--nobg);border-color:var(--no);animation:shake .3s}
.go,.show,.say{font:inherit;font-size:16px;font-weight:700;border-radius:8px;padding:3px 12px;cursor:pointer;border:2px solid var(--pink);background:var(--pink);color:#fff;margin:2px}
.show{background:#fff;color:#7a5600;border-color:#e6c56a}
.say{background:#fff;color:#0b4a8f;border-color:#0b4a8f;direction:ltr}
.fb{direction:rtl;text-align:right;font-size:17px;border-radius:10px;padding:6px 12px;margin-top:6px}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:#12411f}
.fb.no{background:var(--nobg);color:#6b1510}
.fb .mean{color:#444;font-size:16px}
.fb .ans{direction:ltr;unicode-bidi:isolate;font-weight:800}
.gl{direction:rtl;text-align:right;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:16px;margin-top:4px}
.fin{direction:rtl;text-align:center;border:3px solid var(--ok);background:var(--okbg);border-radius:14px;padding:16px;margin-top:24px;font-size:22px;font-weight:800;color:var(--ok)}
.fin span{display:inline-block;animation:pop 1s ease-in-out infinite alternate}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:22px;font-size:14px;color:#777}
.reset{font:inherit;font-size:15px;border:1.5px solid #999;background:#fff;color:#555;border-radius:8px;padding:4px 12px;cursor:pointer}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{to{transform:scale(1.3) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){body{font-size:17px}.paper{padding:12px 10px 22px;margin:8px 4px 40px}.q img{height:90px}}
@media print{.top,.reset,.go,.show,.say{display:none}}
</style>
</head>

<div class="top">
  <button class="who" id="w0" type="button"></button>
  <button class="who" id="w1" type="button"></button>

<main class="paper" id="page"></main>
<script>
const C=(t,o,a,r,ar,x)=>Object.assign({t,g:[{o,a}],r,ar},x||{});
const G=(t,ok,r,h,ar,say)=>({t,g:[{ok:[].concat(ok)}],r,h,ar,say});
const AR=`<span class="arrow">➜</span>`;
const N4=["1","2","3","4"];

const UNITS=[
{name:"Big Changes",secs:[
 {part:"Grammar",title:"Choose the correct form in brackets",ar:"اختر الإجابة الصحيحة من بين الأقواس",
  rule:`<ul>
  <li><b>every</b> (كل يوم / كل أسبوع) = مضارع بسيط: مع <b>he / she / it</b> أو اسم واحد نضيف <b>s</b>، ومع <b>I / we / they / you</b> بدون s.</li>
  <li>بعد <b>doesn't / don't / didn't</b> الفعل يرجع أصلي بدون أي زيادة.</li>
  <li><b>now / right now</b> مع <b>is / are</b> = الفعل + <b>ing</b>.</li>
  <li><b>was / were</b> = الفعل + <b>ing</b>.</li>
  <li><b>yesterday / last / ago</b> = ماضي: نضيف <b>ed</b> أو فعل شاذ (<b>see → saw</b>).</li>
  <li>بعد <b>have / has</b> = التصريف الثالث (<b>played, studied, eaten</b>).</li></ul>`,
  items:[
  C("Ali {0} early every morning.",["wake up","woke up","woken up","wakes up"],3,`<b>every morning</b> = عادة تتكرر (مضارع بسيط). و <b>Ali</b> شخص واحد (he) فنضيف <b>s</b>: <b>wakes up</b>.`,"علي يصحى بدري كل صباح."),
  C("They {0} football every week.",["play","plays","playing","played"],0,`<b>every week</b> = مضارع بسيط. مع <b>They</b> الفعل بدون s: <b>play</b>.`,"هم يلعبون كرة القدم كل أسبوع."),
  C("He doesn't {0} his teeth.",["brush","brushes","brushed","brushing"],0,`بعد <b>doesn't</b> الفعل أصلي بدون s وبدون ed وبدون ing: <b>brush</b>.`,"هو ما ينظف أسنانه."),
  C("It is {0} right now.",["rain","rains","rained","raining"],3,`<b>right now</b> = الحين. و <b>is</b> + الفعل + <b>ing</b>: <b>is raining</b>.`,"السماء تمطر الحين."),
  C("I was {0} English when I lived in London.",["learn","learns","learned","learning"],3,`بعد <b>was</b> الفعل ياخذ <b>ing</b>: <b>was learning</b>.`,"كنت أتعلم الإنجليزي لما كنت ساكن في لندن."),
  C("She {0} her house yesterday.",["clean","cleans","cleaned","cleaning"],2,`<b>yesterday</b> = أمس = ماضي. نضيف <b>ed</b>: <b>cleaned</b>.`,"هي نظفت بيتها أمس."),
  C("We {0} a nice movie last night.",["see","saw","sees","seeing"],1,`<b>last night</b> = ماضي. و <b>see</b> فعل شاذ ماضيه <b>saw</b>.`,"شفنا فيلم حلو البارحة."),
  C("They have {0} tennis three times.",["play","played","plays","playing"],1,`بعد <b>have</b> نحط التصريف الثالث: <b>have played</b>.`,"هم لعبوا تنس ثلاث مرات."),
  C("He has {0} for one hour.",["study","studies","studied","studying"],2,`بعد <b>has</b> نحط التصريف الثالث: <b>has studied</b>.`,"هو ذاكر لمدة ساعة.")
 ]},
 {title:"Correct the errors in the following sentences",ar:"صحّح الكلمة اللي تحتها خط واكتبها صح",
  rule:`الكلمة اللي تحتها خط غلط. شوف الكلمة المفتاح في الجملة (<b>every / a day</b> = مضارع، <b>yesterday / last</b> = ماضي) واكتب الكلمة الصحيحة بس.`,
  items:[
  G(`She <u>pray</u> five times a day. ${AR} {0}`,["prays","She prays five times a day"],`<b>five times a day</b> = عادة (مضارع بسيط). ومع <b>She</b> نضيف <b>s</b>: <b>prays</b>.`,`مع <b>She</b> في المضارع، وش نضيف في آخر الفعل؟`,"هي تصلي خمس مرات في اليوم.","She prays five times a day."),
  G(`I <u>visit</u> Jeddah last year. ${AR} {0}`,["visited","I visited Jeddah last year"],`<b>last year</b> = السنة اللي فاتت = ماضي. نضيف <b>ed</b>: <b>visited</b>.`,`<b>last year</b> ماضي. وش نضيف للفعل في الماضي؟`,"زرت جدة السنة اللي فاتت.","I visited Jeddah last year."),
  G(`<u>Do</u> he work yesterday? ${AR} {0}`,["Did","Did he work yesterday"],`<b>yesterday</b> = ماضي. السؤال في الماضي يبدأ بـ <b>Did</b>.`,`<b>yesterday</b> ماضي. ماضي <b>Do</b> هو...؟ (يبدأ بحرف D)`,"هل اشتغل أمس؟","Did he work yesterday?"),
  G(`She <u>weren't</u> sleeping. ${AR} {0}`,["wasn't","was not","She wasn't sleeping","She was not sleeping"],`مع <b>She / He / It / I</b> نقول <b>was</b>. والنفي: <b>wasn't</b>. (<b>were</b> مع they / we / you)`,`<b>were</b> مع الجمع. مع <b>She</b> نقول...؟ ولا تنسى النفي n't`,"هي ما كانت نايمة.","She wasn't sleeping."),
  G(`Ali was walking when he <u>see</u> Ahmed. ${AR} {0}`,["saw","Ali was walking when he saw Ahmed"],`بعد <b>when</b> نحط ماضي بسيط. وماضي <b>see</b> هو <b>saw</b>.`,`بعد <b>when</b> نحط ماضي. ماضي <b>see</b> فعل شاذ يبدأ بحرف s`,"علي كان يمشي لما شاف أحمد.","Ali was walking when he saw Ahmed.")
 ]},
 {title:"Complete the following",ar:"أكمل الجمل",
  rule:`<ul><li><b>present perfect</b> = <b>have / has</b> + التصريف الثالث. مع <b>I</b> نقول <b>have</b>. و <b>see → seen</b>.</li>
  <li><b>ago</b> تجي <u>بعد</u> المدة: <b>two days ago</b> (قبل يومين).</li>
  <li><b>last</b> تجي <u>قبل</u> الوقت: <b>last night</b> (البارحة).</li></ul>`,
  items:[
  G("I (see) {0} this movie three times. <small>(present perfect)</small>",["have seen","I have seen","'ve seen"],`المضارع التام = <b>have</b> + التصريف الثالث. تصريف <b>see</b> الثالث هو <b>seen</b>: <b>have seen</b>.`,`كلمتين: <b>have</b> + التصريف الثالث من <b>see</b> (see – saw – ...؟)`,"شفت هذا الفيلم ثلاث مرات."),
  C("I visited my grandmother two days {0}.",["last","ago"],1,`<b>ago</b> تجي بعد المدة: <b>two days ago</b> = قبل يومين.`,"زرت جدتي قبل يومين."),
  C("She visited her friend {0} night.",["last","ago"],0,`<b>last</b> تجي قبل الوقت: <b>last night</b> = البارحة.`,"هي زارت صديقتها البارحة.")
 ]},
 {title:"Do as shown between brackets",ar:"نفّذ المطلوب بين القوسين",
  rule:`<ul><li><b>النفي</b> مع he / she / it: <b>doesn't</b> + الفعل <u>بدون s</u>. (drinks ← doesn't drink)</li>
  <li><b>الربط بـ when</b>: الحدث الطويل <b>was + ing</b> ثم <b>when</b> ثم الحدث القصير ماضي بسيط.</li>
  <li><b>الإجابة القصيرة بالنفي</b>: السؤال بدأ بـ <b>Were people</b> فالجواب: <b>No, they weren't.</b></li></ul>`,
  items:[
  G("He drinks milk every morning. <small>(Change into negative)</small><br>{0}",["He doesn't drink milk every morning","He does not drink milk every morning"],`النفي: <b>doesn't</b> + الفعل بدون s. <b>drinks</b> صارت <b>drink</b>.`,`ابدأ: <b>He doesn't</b> ... ثم الفعل <u>بدون s</u> وكمّل باقي الجملة.`,"هو ما يشرب حليب كل صباح.","He doesn't drink milk every morning."),
  G("I walk home / it starts to rain. <small>(Join using when)</small><br>{0}",["I was walking home when it started to rain","When it started to rain I was walking home","I was walking home when it started raining"],`الحدث الطويل: <b>was walking</b>. ثم <b>when</b>. ثم الحدث القصير ماضي: <b>started</b>.`,`الترتيب: <b>I was walking home</b> + <b>when</b> + <b>it started to rain</b>`,"كنت ماشي للبيت لما بدأ المطر.","I was walking home when it started to rain."),
  G("Were people using computers in 1900? <small>(Give negative short answer)</small><br>{0}",["No, they weren't","No they were not"],`السؤال بدأ بـ <b>Were</b>، و <b>people</b> = <b>they</b>. الجواب بالنفي: <b>No, they weren't.</b>`,`ثلاث كلمات: <b>No, they</b> ... ونفي <b>were</b>`,"هل كان الناس يستخدمون الكمبيوتر سنة 1900؟ لا.","No, they weren't.")
 ]},
 {part:"Vocabulary",mute:1,title:"Circle the odd words",ar:"اختر الكلمة الغريبة (المختلفة عن الباقي)",
  rule:`<div class="gl"><span><b>traffic</b> زحمة السيارات</span><span><b>online</b> على الإنترنت</span><span><b>vibrant</b> نشيط وحيوي</span><span><b>lazy</b> كسول</span><span><b>ambitious</b> طموح</span><span><b>thriving</b> مزدهر</span><span><b>pollution</b> تلوث</span><span><b>poverty</b> فقر</span><span><b>hub</b> مركز</span><span><b>economy</b> اقتصاد</span><span><b>global warming</b> الاحتباس الحراري</span><span><b>disease</b> مرض</span><span><b>floods</b> فيضانات</span><span><b>earthquakes</b> زلازل</span><span><b>unemployment</b> بطالة</span><span><b>disaster</b> كارثة</span><span><b>security</b> أمن</span><span><b>host</b> مستضيف</span><span><b>guest</b> ضيف</span><span><b>wealth</b> غنى</span><span><b>danger</b> خطر</span><span><b>transparent</b> واضح وشفاف</span><span><b>establish</b> يؤسس</span><span><b>transforming</b> يغيّر تمامًا</span></div>`,ruleTitle:"معاني الكلمات (احفظها)",
  items:[
  C("{0}",["E-mail","Google","traffic","online"],2,`<b>traffic</b> (زحمة السيارات) هي الغريبة. الباقي كلها عن الإنترنت.`),
  C("{0}",["vibrant","lazy","ambitious","thriving"],1,`<b>lazy</b> (كسول) صفة سلبية. الباقي صفات إيجابية: نشيط، طموح، مزدهر.`),
  C("{0}",["Pollution","poverty","traffic","hub"],3,`<b>hub</b> (مركز) هي الغريبة. الباقي مشاكل: تلوث، فقر، زحمة.`)
 ]},
 {title:"Fill in the spaces with suitable word",ar:"اختر الكلمة المناسبة من الصندوق",
  pre:"( traffic - economy - global warming - disease )",
  items:[
  C("Hotter summers are an effect of {0}.",["traffic","economy","global warming","disease"],2,`<b>global warming</b> = الاحتباس الحراري، وهو سبب إن الصيف صار أحر.`,"الصيف الأحر نتيجة الاحتباس الحراري."),
  C("Corona virus is a {0} that started in China.",["traffic","economy","global warming","disease"],3,`<b>disease</b> = مرض. كورونا مرض.`,"فيروس كورونا مرض بدأ في الصين."),
  C("{0} in Riyadh is a big problem because there are so many cars.",["Traffic","Economy","Global warming","Disease"],0,`<b>so many cars</b> = سيارات كثيرة، يعني <b>traffic</b> (زحمة).`,"الزحمة في الرياض مشكلة كبيرة لأن السيارات كثيرة.")
 ]},
 {mute:1,title:"Classify the items into the correct category",ar:"صنّف كل كلمة: مشكلة عالمية أو كارثة طبيعية",
  rule:`<b>Global Issues</b> = مشاكل عالمية (من الناس وتأثر على العالم). <b>Natural Disasters</b> = كوارث طبيعية (تصير من الطبيعة فجأة).`,
  items:[
  C("pollution {0}",["Global Issues","Natural Disasters"],0,`<b>pollution</b> = تلوث. مشكلة عالمية.`),
  C("floods {0}",["Global Issues","Natural Disasters"],1,`<b>floods</b> = فيضانات. كارثة طبيعية.`),
  C("diseases {0}",["Global Issues","Natural Disasters"],0,`<b>diseases</b> = أمراض. مشكلة عالمية.`),
  C("global warming {0}",["Global Issues","Natural Disasters"],0,`<b>global warming</b> = الاحتباس الحراري. مشكلة عالمية.`),
  C("earthquakes {0}",["Global Issues","Natural Disasters"],1,`<b>earthquakes</b> = زلازل. كارثة طبيعية.`)
 ]},
 {mute:1,title:"Match the words with the meanings",ar:"اختر رقم الكلمة اللي لها نفس المعنى",
  pre:`<table><tr><td>1</td><td>hub</td></tr><tr><td>2</td><td>establish</td></tr><tr><td>3</td><td>transforming</td></tr><tr><td>4</td><td>vibrant</td></tr></table>`,
  items:[
  C("{0} set up - start",N4,1,`<b>establish</b> = يؤسس = <b>set up / start</b>.`),
  C("{0} active &amp; strong",N4,3,`<b>vibrant</b> = نشيط وقوي = <b>active &amp; strong</b>.`),
  C("{0} center",N4,0,`<b>hub</b> = مركز = <b>center</b>.`),
  C("{0} Changing completely",N4,2,`<b>transforming</b> = يتغير تمامًا = <b>changing completely</b>.`)
 ]},
 {mute:1,title:"Match the words with their opposites",ar:"اختر رقم الكلمة اللي معناها عكس",
  pre:`<table><tr><td>1</td><td>poverty</td></tr><tr><td>2</td><td>security</td></tr><tr><td>3</td><td>host</td></tr><tr><td>4</td><td>transparent</td></tr></table>`,
  items:[
  C("{0} unclear",N4,3,`<b>transparent</b> (واضح) عكسها <b>unclear</b> (غير واضح).`),
  C("{0} guest",N4,2,`<b>host</b> (مستضيف) عكسها <b>guest</b> (ضيف).`),
  C("{0} wealth",N4,0,`<b>poverty</b> (فقر) عكسها <b>wealth</b> (غنى).`),
  C("{0} danger",N4,1,`<b>security</b> (أمن) عكسها <b>danger</b> (خطر).`)
 ]},

  <li>بعد <b>have been / has been</b> = الفعل + <b>ing</b>.</li>
  <li><b>How long</b> = كم المدة؟ &nbsp; <b>How many</b> = كم العدد؟ (شي ينعد: lessons, friends) &nbsp; <b>How much</b> = كم؟ (شي ما ينعد: money).</li>
  <li><b>good at</b> و <b>interested in</b> (احفظهم كذا). والفعل بعدهم ياخذ <b>ing</b>.</li>
  <li><b>who</b> للإنسان، <b>which</b> للأشياء.</li>
  <li><b>while</b> = بينما: الفعلين فيهم <b>ing</b>. مع <b>It</b> نقول <b>was</b>، ومع <b>They</b> نقول <b>were</b>.</li></ul>`,
  items:[
  C("Ahmed has {0} three burgers.",["eat","eats","ate","eaten"],3,`بعد <b>has</b> التصريف الثالث: eat – ate – <b>eaten</b>.`,"أحمد أكل ثلاث برجر."),
  C("They have been {0} football since morning.",["play","plays","playing","played"],2,`بعد <b>have been</b> الفعل + <b>ing</b>: <b>have been playing</b>.`,"هم يلعبون كرة من الصباح (وما زالوا)."),
  C("I have {0} to Dubai three times.",["travel","travels","traveled","traveling"],2,`بعد <b>have</b> التصريف الثالث: <b>have traveled</b>.`,"سافرت دبي ثلاث مرات."),
  C("How {0} have you been working there?",["long","many","much","often"],0,`نسأل عن المدة (من متى تشتغل؟) = <b>How long</b>.`,"من متى وأنت تشتغل هناك؟"),
  C("{0} lessons has she explained?",["How long","How much","How many","How often"],2,`<b>lessons</b> شي ينعد (درس، درسين) = <b>How many</b>.`,"كم درس شرحت؟"),
  C("He is good at {0} cars.",["repair","repairs","repaired","repairing"],3,`بعد <b>at</b> (حرف جر) الفعل ياخذ <b>ing</b>: <b>repairing</b>.`,"هو شاطر في تصليح السيارات."),
  C("She is interested in {0} pasta.",["cook","cooks","cooked","cooking"],3,`بعد <b>in</b> (حرف جر) الفعل ياخذ <b>ing</b>: <b>cooking</b>.`,"هي مهتمة بطبخ المكرونة."),
  C("He is interested {0} reading novels.",["at","in","on","of"],1,`احفظها: <b>interested in</b> = مهتم بـ.`,"هو مهتم بقراءة الروايات."),
  C("He is good {0} speaking English.",["at","in","on","of"],0,`احفظها: <b>good at</b> = شاطر في.`,"هو شاطر في تحدث الإنجليزي."),
  C("This is the shirt {0} I bought yesterday.",["who","which","where","when"],1,`<b>shirt</b> (قميص) شي مو إنسان = <b>which</b>.`,"هذا القميص اللي اشتريته أمس."),
  C("This is the boy {0} had an accident.",["who","which","where","when"],0,`<b>boy</b> (ولد) إنسان = <b>who</b>.`,"هذا الولد اللي صار له حادث."),
  {t:"It {0} while they {1}.",g:[{o:["rains","raining","was raining","were raining"],a:2},{o:["play","playing","was playing","were playing"],a:3}],r:`مع <b>while</b> الفعلين <b>was / were + ing</b>. مع <b>It</b> نقول <b>was raining</b>، ومع <b>they</b> نقول <b>were playing</b>.`,ar:"كانت تمطر وهم يلعبون.",h:`مع <b>It</b> نستخدم <b>was</b>، ومع <b>they</b> نستخدم <b>were</b>. ولازم <b>ing</b>.`}
 ]},
 {title:"Correct the underlined errors",ar:"صحّح الكلمة اللي تحتها خط واكتبها صح",
  rule:`<ul><li><b>for</b> + مدة (for eight hours, for two years). &nbsp; <b>since</b> + بداية الوقت (since morning, since 2020).</li>
  <li><b>money</b> ما تنعد = <b>How much</b>.</li>
  <li>السؤال مع <b>he / she / it</b> = <b>does</b>.</li>
  <li>بعد <b>was</b> وبعد <b>in / at</b> الفعل ياخذ <b>ing</b>.</li>
  <li>مع الأيام و the weekend نقول <b>on</b>.</li></ul>`,
  items:[
  G(`He has been working <u>since</u> eight hours. ${AR} {0}`,["for","He has been working for eight hours"],`<b>eight hours</b> مدة (كم ساعة) = <b>for</b>. أما <b>since</b> مع بداية الوقت.`,`<b>eight hours</b> مدة. مع المدة نقول <b>for</b> ولا <b>since</b>؟`,"هو يشتغل من ثمان ساعات.","He has been working for eight hours."),
  G(`How <u>many</u> money have you spent? ${AR} {0}`,["much","How much money have you spent"],`<b>money</b> ما تنعد = <b>How much</b>.`,`<b>money</b> ما نقدر نعدّها (ما نقول one money). نستخدم <b>How m...</b>؟`,"كم صرفت فلوس؟","How much money have you spent?"),
  G(`Where <u>do</u> he work? ${AR} {0}`,["does","Where does he work"],`مع <b>he</b> نقول <b>does</b> (do مع I / you / we / they).`,`مع <b>he / she / it</b> نضيف <b>es</b> على do`,"وين يشتغل؟","Where does he work?"),
  G(`It was raining while Ali was <u>wash</u> the car. ${AR} {0}`,["washing","It was raining while Ali was washing the car"],`بعد <b>was</b> الفعل ياخذ <b>ing</b>: <b>was washing</b>.`,`بعد <b>was</b> نضيف للفعل ثلاث حروف...`,"كانت تمطر وعلي يغسل السيارة.","It was raining while Ali was washing the car."),
  G(`He is interested in <u>drive</u> sport cars. ${AR} {0}`,["driving","He is interested in driving sport cars"],`بعد <b>in</b> الفعل ياخذ <b>ing</b>. ونحذف حرف e: <b>driving</b>.`,`بعد <b>in</b> نضيف <b>ing</b> (وانتبه: نحذف حرف e من drive)`,"هو مهتم بقيادة السيارات الرياضية.","He is interested in driving sport cars."),
  G(`We play football <u>in</u> the weekend. ${AR} {0}`,["on","at","We play football on the weekend"],`نقول <b>on the weekend</b> = في نهاية الأسبوع.`,`مع الأيام و the weekend نستخدم حرف جر من حرفين يبدأ بـ o`,"نلعب كرة في نهاية الأسبوع.","We play football on the weekend.")
 ]},
 {title:"Complete the following",ar:"أكمل الجمل",
  rule:`<ul><li><b>who</b> للإنسان (taxi driver = سواق = إنسان).</li>
  <li><b>Past Progressive</b> = <b>was / were</b> + الفعل + <b>ing</b>. مع <b>They</b> نقول <b>were</b>.</li>
  <li>مع أيام الأسبوع نقول <b>on</b>: on Sunday.</li></ul>`,
  items:[
  C("This is the taxi driver {0} brought us to the hotel yesterday.",["who","which"],0,`<b>taxi driver</b> (سواق) إنسان = <b>who</b>.`,"هذا سواق التاكسي اللي وصّلنا للفندق أمس."),
  {t:"They {0} (talk) while they {1} (wait) for the bus. <small>(Past Progressive)</small>",g:[{ok:["were talking"]},{ok:["were waiting"]}],r:`الماضي المستمر = <b>were</b> + الفعل + <b>ing</b> (لأن الفاعل <b>They</b>): <b>were talking</b> و <b>were waiting</b>.`,h:`كل فراغ كلمتين: <b>were</b> + الفعل + <b>ing</b>`,ar:"كانوا يسولفون وهم ينتظرون الباص.",say:"They were talking while they were waiting for the bus."},
  G("He works at the hospital {0} Sunday. <small>(suitable preposition)</small>",["on"],`مع أيام الأسبوع نقول <b>on</b>: <b>on Sunday</b>.`,`مع الأيام (Sunday, Monday...) حرف الجر هو <b>o_</b>`,"هو يشتغل في المستشفى يوم الأحد.")
 ]},
 {title:"Do as shown between brackets",ar:"نفّذ المطلوب بين القوسين",
  rule:`<ul><li><b>present perfect simple</b> = <b>has / have</b> + التصريف الثالث. مع <b>She</b> نقول <b>has</b>.</li>
  <li>الجواب عدد (three) والاسم ينعد (friends) = السؤال بـ <b>How many</b>.</li>
  <li>الكلمة اللي تحتها خط مكان (in a hospital) = السؤال بـ <b>Where</b>. ومع She: <b>Where does she work?</b></li></ul>`,
  items:[
  G("She (clean) {0} three rooms. <small>(Use present perfect simple)</small>",["has cleaned","She has cleaned","'s cleaned"],`مع <b>She</b> نقول <b>has</b> + التصريف الثالث: <b>has cleaned</b>.`,`كلمتين: <b>has</b> + الفعل وفي آخره <b>ed</b>`,"هي نظفت ثلاث غرف."),
  G("{0} friends have you got? (three) <small>(Make a question for the answer)</small>",["How many"],`الجواب <b>three</b> (عدد) و <b>friends</b> تنعد = <b>How many</b>.`,`الجواب عدد. نسأل عن العدد بكلمتين: <b>How ...</b>؟`,"كم صديق عندك؟ (ثلاثة)"),
  G("She works <u>in a hospital</u>. <small>(Ask a question about the underlined word)</small><br>{0}",["Where does she work"],`<b>in a hospital</b> مكان = <b>Where</b>. ومع <b>She</b> نقول <b>does</b> والفعل بدون s: <b>Where does she work?</b>`,`الترتيب: <b>Where</b> + <b>does</b> + <b>she</b> + الفعل بدون s`,"وين تشتغل؟","Where does she work?")
 ]},
 {part:"Vocabulary",mute:1,title:"Circle the odd words",ar:"اختر الكلمة الغريبة (المختلفة عن الباقي)",

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const norm=s=>s.toLowerCase().replace(/[’'`]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const plain=h=>{const d=el("div","",h.replace(/<small>.*?<\/small>/g,"").replace(/<br>/g," "));return d.textContent.replace(/\s+/g," ").trim()};
const ansOf=g=>g.o?g.o[g.a]:g.ok[0];
let ac;
function beep(good){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;(good?[660,880]:[200]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=good?"sine":"square";o.frequency.value=f;g.gain.setValueAtTime(.12,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.2);o.connect(g).connect(ac.destination);o.start(t+i*.12);o.stop(t+i*.12+.22)})}catch(e){}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function ids(u){const a=[];UNITS[u].secs.forEach((s,si)=>s.items.forEach((_,i)=>a.push(u+"-"+si+"-"+i)));return a}
function count(w,u){const a=ids(u);return [a.filter(i=>S.d[w][i]).length,a.length,a.filter(i=>S.d[w][i]===1).length]}

function mkItem(it,id,n,sec){
  const q=el("div","q"),b=el("div","b"),line=el("div","line"),fb=el("div","fb"),ctl=[];
  let left=it.g.length,tries=0;
  q.appendChild(el("span","n",n+"-"));
  if(it.img){const im=el("img");im.src=it.img;im.alt="";b.appendChild(im)}
  const sayText=it.say||(sec.mute?"":plain(it.t.replace(/\{(\d)\}/g,(_,k)=>ansOf(it.g[+k]))));
  function reveal(){
    ctl.forEach(c=>c());q.classList.add("done");fb.className="fb ok";
    fb.innerHTML=`<div>✅ ${it.r}</div>`+(it.ar?`<div class="mean">المعنى: ${it.ar}</div>`:"");
    if(sayText){const s=el("button","say","🔊 Listen");s.type="button";s.onclick=()=>speak(sayText);fb.appendChild(s)}
  }
  function finish(v){S.d[S.who][id]=v;save();reveal();if(v===1)beep(1);update(true)}
  function wrong(){beep(0);fb.className="fb no";fb.innerHTML="❌ "+(it.h||"مو هذي. اقرأ القاعدة فوق وجرّب مرة ثانية.");
    if(it.g.some(g=>g.ok)&&++tries>=2){const s=el("button","show","ورّني الإجابة");s.type="button";s.onclick=()=>finish(2);fb.appendChild(el("br"));fb.appendChild(s)}}
  it.t.split(/(\{\d\})/).forEach(p=>{
    const m=p.match(/^\{(\d)\}$/);
    if(!m){if(p)line.appendChild(el("span","",p));return}
    const g=it.g[+m[1]];
    if(g.o){
      const w=el("span","opts");let got=false;
      const lock=()=>{[...w.children].forEach((c,i)=>{c.disabled=true;c.classList.remove("bad");c.classList.add(i===g.a?"ok":"dim")})};
      g.o.forEach((o,i)=>{const c=el("button","chip",o);c.type="button";c.onclick=()=>{
        if(i===g.a){got=true;lock();if(--left===0)finish(1);else{beep(1);fb.className="fb";fb.innerHTML=""}}
        else{c.classList.add("bad");c.disabled=true;wrong()}};w.appendChild(c)});
      ctl.push(lock);line.appendChild(w);
    }else{
      const inp=el("input","gap"),go=el("button","go","✓");let got=false;
      inp.type="text";inp.size=Math.max(g.ok[0].length+3,8);inp.autocomplete="off";inp.spellcheck=false;inp.autocapitalize="off";inp.setAttribute("aria-label","answer");
      go.type="button";go.setAttribute("aria-label","Check");
      const lock=()=>{inp.value=g.ok[0];inp.readOnly=true;inp.classList.remove("bad");inp.classList.add("ok");go.hidden=true};
      const check=()=>{if(got||inp.readOnly)return;const v=norm(inp.value);
        if(!v){fb.className="fb no";fb.innerHTML="اكتب إجابتك أول.";inp.focus();return}
        if(g.ok.some(a=>norm(a)===v)){got=true;lock();if(--left===0)finish(1);else beep(1)}
        else{inp.classList.remove("bad");void inp.offsetWidth;inp.classList.add("bad");wrong()}};
      inp.oninput=()=>inp.classList.remove("bad");
      inp.onkeydown=e=>{if(e.key==="Enter")check()};go.onclick=check;
      ctl.push(lock);line.appendChild(inp);line.appendChild(go);
    }
  });
  b.appendChild(line);b.appendChild(fb);q.appendChild(b);
  if(S.d[S.who][id])reveal();
  return q;
}

function render(){
  const U=UNITS[S.u],page=$("page");page.innerHTML="";
  page.appendChild(el("header","ph",`<div class="rt">REVISION UNIT (${S.u+1})</div><div class="ut">${U.name}</div><div class="turn">الدور الحين على: <b>${NAMES[S.who]}</b></div>`));
  U.secs.forEach((sec,si)=>{
    if(sec.part)page.appendChild(el("div","part",sec.part));
    page.appendChild(el("h3","",sec.title));
    page.appendChild(el("div","hint-ar",sec.ar));
    if(sec.rule){const d=el("details","rule",`<summary>📘 ${sec.ruleTitle||"القاعدة باختصار"}</summary>${sec.rule}`);d.open=true;page.appendChild(d)}
    if(sec.pre)page.appendChild(el("div","pre",sec.pre));
    sec.items.forEach((it,i)=>page.appendChild(mkItem(it,S.u+"-"+si+"-"+i,i+1,sec)));
  });
  const fin=el("div","fin");fin.id="fin";fin.hidden=true;page.appendChild(fin);
  const foot=el("div","foot",`<span>Worksheet by Entisar Al-Obaidallah</span>`),r=el("button","reset",`ابدأ من جديد (${NAMES[S.who]} - Unit ${S.u+1})`);
  r.type="button";r.onclick=()=>{if(!confirm("نمسح إجابات "+NAMES[S.who]+" في هذي الوحدة؟"))return;ids(S.u).forEach(i=>delete S.d[S.who][i]);save();render();scrollTo(0,0)};
  foot.appendChild(r);page.appendChild(foot);update(false);
}
function update(jump){
  [0,1].forEach(w=>{const a=count(w,0),b=count(w,1);$("w"+w).innerHTML=`${NAMES[w]}<small>⭐ ${a[2]+b[2]}</small>`;$("w"+w).classList.toggle("on",S.who===w)});
  [0,1].forEach(u=>$("t"+u).classList.toggle("on",S.u===u));
  const c=count(S.who,S.u);$("bar").style.width=Math.round(c[0]/c[1]*100)+"%";
  const fin=$("fin");if(!fin)return;
  if(c[0]===c[1]){const was=fin.hidden;fin.hidden=false;fin.innerHTML=`<span>🎉</span> أحسنت يا ${NAMES[S.who]}! خلصت Unit ${S.u+1} <span>🎉</span><br>⭐ ${c[2]} من ${c[1]} حليتها بنفسك`;if(was&&jump)fin.scrollIntoView({behavior:"smooth",block:"center"})}
  else fin.hidden=true;
}
[0,1].forEach(i=>{$("w"+i).onclick=()=>{S.who=i;save();render()};$("t"+i).onclick=()=>{S.u=i;save();render();scrollTo(0,0)}});
render();
</script>
</body>
</html>
